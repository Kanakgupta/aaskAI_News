name: refresh-news-and-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch latest news into public/data
        run: node scripts/build-data.mjs
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub's cron is throttled, so each run schedules the next one (workflow_dispatch via GITHUB_TOKEN is allowed to chain).
  # The newest waiting job cancels older ones, so only one chain ever exists; the 15-minute cron restarts a broken chain.
  next:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    concurrency:
      group: refresh-chain
      cancel-in-progress: true
    steps:
      - name: Wait, then start the next refresh
        run: sleep 240
      - run: gh workflow run refresh.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
